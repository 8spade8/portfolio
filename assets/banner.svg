<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Mohamed Kallel: AI Agents, Data, Automation and Full-Stack Engineering</title>
  <desc id="d">Portfolio banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14183a"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- pipeline motif -->
  <g transform="translate(790 70)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <rect x="0" y="20" width="84" height="56" rx="12"/>
    <rect x="150" y="100" width="84" height="56" rx="12"/>
    <rect x="300" y="20" width="84" height="56" rx="12"/>
    <path d="M84 48 H116 Q134 48 134 66 V112 Q134 128 150 128"/>
    <path d="M234 128 H266 Q284 128 284 110 V58 Q284 48 300 48"/>
    <circle cx="42" cy="48" r="8"/>
    <path d="M178 128 h28 M192 114 v28" />
    <path d="M326 48 l14 14 l22 -26"/>
  </g>
  <g fill="#c7d2fe" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" opacity="0.8">
    <text x="800" y="62">ingest</text>
    <text x="948" y="242">transform</text>
    <text x="1112" y="62">serve</text>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="64" y="112" fill="#a5b4fc" font-size="16" letter-spacing="4">PORTFOLIO</text>
    <text x="64" y="176" fill="#ffffff" font-size="60" font-weight="800">Mohamed Kallel</text>
    <rect x="66" y="198" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="242" fill="#e2e8f0" font-size="24" font-weight="500">AI agents · Data pipelines · Automation · Full-stack</text>
    <text x="64" y="272" fill="#94a3b8" font-size="16">Real systems for real teams, documented by architecture.</text>
    <text x="64" y="300" fill="#a5b4fc" font-size="14" letter-spacing="1">LangGraph · LangChain · n8n · Apps Script · Kafka · Spark</text>
  </g>
